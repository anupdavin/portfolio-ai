name: Cinematic landing verification

on:
  push:
    branches:
      - feat/cinematic-landing-orchestration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinematic-landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and production build
        run: npm run verify:local

      - name: Capture cinematic review frames
        run: npm run review:cinematic

      - name: Upload cinematic review frames
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-review
          path: .cinematic-review
          if-no-files-found: error
          retention-days: 7
